<!DOCTYPE html>
<html>
<head>
    <title>Login - KnowledgeGrove</title>

    <style>
         header {
            background-color: #09566A;
            color: white;
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        body {
            margin: 0;
            font-family: Arial;
            background: linear-gradient(white, skyblue, white);
        }

        .login-box {
            width: 350px;
            margin: 100px auto;
            background-color: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 10px gray;
        }

        h2 {
            text-align: center;
            color: #09566A;
        }

        label {
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 10px;
            margin: 8px 0 18px;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 10px;
            background-color: #09566A;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
        }

        .home {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #09566A;
        }
         footer {
            background-color: #09566A;
            color: white;
            text-align: center;
            padding: 15px;
        }
    </style>
</head>

<body>
    <header>

    <div class="logo">
        📚
        <span class="knowledge">KNOWLEDGE</span><span class="grove">GROVE</span>
    </div>
</header>

<div class="login-box">

    <h2>📚 KNOWLEDGEGROVE</h2>
    <h2>Login</h2>

    <form action="Home1.html">

        <label>Username</label>
        <input type="text"
               name="username"
               placeholder="Enter username"
               required>

        <label>Password</label>
        <input type="password"
               name="password"
               placeholder="Enter password"
               required>

        <button type="submit">Login</button>

    </form>

    <a href="Home1.html" class="home">
        ← Back to Home
    </a>

</div>
<footer>
    📚 KNOWLEDGEGROVE
    <br>
    Learn • Explore • Discover
    <br>
    © 2026 All Rights Reserved
</footer>

</body>
</html>
